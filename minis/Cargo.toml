[package]
name = "siboot"
version = "0.13.1"
edition = "2021"
description = "PC-free bootstrap that installs SideInstaller onto the iPhone it runs on, from Open Minis's Linux shell, with the pairing made in rootshell"
license = "MIT"
publish = false

[[bin]]
name = "siboot"
path = "src/main.rs"

# Its own workspace: this crate builds for
# aarch64-unknown-linux-musl (Open Minis runs an ARM64 iSH), so it must not
# share rust-core's lockfile, which is resolved around the Apple targets.
[workspace]

[dependencies]
# The same vendored idevice SideInstaller ships (OPACK back-reference fix and
# logging changes, see ../rust-core/vendor/idevice/README.md), with the features
# the pipeline needs:
#   remote_pairing     pair-verify with the pairing file from rootshell
#   tunnel_tcp_stack   in-process software TCP stack over the CDTunnel
#   rsd / xpc / tcp    RemoteServiceDiscovery inside the tunnel
#   afc                /PublicStaging upload
#   installation_proxy the install
#   house_arrest       writing the pairing file into SideInstaller's container
# `aws-lc`, as rust-core: aarch64 musl is a supported aws-lc target.
idevice = { path = "../rust-core/vendor/idevice", default-features = false, features = [
  "aws-lc",
  "remote_pairing",
  "tunnel_tcp_stack",
  "rsd",
  "xpc",
  "tcp",
  "afc",
  "installation_proxy",
  "house_arrest",
] }

# Apple ID sign-in, developer portal and signing: SideInstaller's vendored copy,
# with `install` off as in rust-core (the install goes over our own tunnel) and
# fs-storage instead of a keyring, which iSH doesn't have.
isideload = { path = "../rust-core/vendor/isideload", default-features = false, features = [
  "fs-storage",
] }

tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "macros",
  "fs",
  "io-util",
  "time",
  "sync",
  "signal",
] }
plist = "1.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Downloading the SideInstaller release. Same line isideload uses, so it adds
# nothing to the tree.
reqwest = { version = "0.13", features = ["json", "gzip"] }
# Named by rust-core's apple_session.rs, which this crate compiles as its own
# (see main.rs). Same versions as rust-core.
rootcause = "0.12"
sha2 = "0.11"
hex = "0.4"
# No-echo password read from the terminal.
rpassword = "7"
tracing = "0.1"
tracing-subscriber = "0.3"

# isideload signs with apple-codesign-quick; SideInstaller's vendored copy also
# signs ExtensionKit extensions (#110). Patches only apply at a workspace root,
# so rust-core's is repeated here.
[patch.crates-io]
apple-codesign-quick = { path = "../rust-core/vendor/apple-codesign-quick" }

[profile.release]
# Runs under emulation inside Minis, so speed matters as much as size: signing
# hashes every page of the app, and every byte of the upload crosses the
# software TCP stack and TLS.
opt-level = 3
lto = "thin"
strip = true
