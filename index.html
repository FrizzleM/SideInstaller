<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SideInstaller</title>
<!-- The site lives at sideinstaller.net, built by FrizzleM/SideInstaller-Signed.
     GitHub Pages serves this file at frizzlem.github.io/SideInstaller/ and, as 404.html,
     for every other path there (.github/workflows/deploy-pages.yml), so each old link
     lands on the same path at sideinstaller.net. -->
<link rel="canonical" href="https://sideinstaller.net/">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#050b18">
<script>
  // /SideInstaller/terms.html -> https://sideinstaller.net/terms.html
  var path = location.pathname.replace(/^\/SideInstaller(?=\/|$)/i, "") || "/";
  location.replace("https://sideinstaller.net" + path + location.search + location.hash);
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://sideinstaller.net/"></noscript>
<style>
  html{background:#050b18; color:#f1f4f9; font:17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}
  body{margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; text-align:center}
  a{color:#60a7fd}
</style>
</head>
<body>
<p>SideInstaller has moved to <a href="https://sideinstaller.net/">sideinstaller.net</a>.</p>
</body>
</html>
